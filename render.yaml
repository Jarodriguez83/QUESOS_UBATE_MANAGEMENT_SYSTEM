services:
  - type: web
    name: quesos-ubate-pruebas
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_HTTPS_ONLY
        value: "true"
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
      - key: INITIAL_OPERATOR_PASSWORD
        generateValue: true
    disk:
      name: quesos-ubate-data
      mountPath: /var/data
      sizeGB: 1

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14231e">
  <title>{% block title %}Quesos Ubaté{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
</head>
<body>
  {% if user %}
  <header class="topbar">
    <a class="brand" href="/pos"><span class="brand-mark">🧀</span><span>Quesos <strong>Ubaté</strong><small>GESTIÓN DEL NEGOCIO</small></span></a>
    <nav class="nav-links">
      <a href="/pos">Caja</a><a href="/inventory">Inventario</a>
      {% if user.role == 'ADMIN' %}<a href="/dashboard">Resumen</a>{% endif %}
    </nav>
    <div class="user-menu"><span>{{ user.name }}<small>{{ user.role }}</small></span><form action="/logout" method="post"><button class="button button-quiet" type="submit">Salir</button></form></div>
  </header>
  {% endif %}
  <main class="page">{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static', path='/js/app.js') }}" defer></script>
</body>
</html>
